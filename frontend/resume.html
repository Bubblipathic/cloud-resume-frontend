<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay Reario | Cloud Resume</title>
    <!-- use tools like Node.js to "compile" the Tailwind classes into one tiny, static style.css file before deploying to AWS S3. -->
    <script src="https://cdn.tailwindcss.com"></script> 
    <script src="js/main.js"></script>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
        <!-- Add Fallback: Legacy ICO/PNG for old browsers or environments that don't support SVG icons -->
</head>
<body class="bg-stone-50 text-stone-900  font-sans min-h-screen flex flex-col">

    <header id="header" class="bg-stone-50 py-6">
        <div class="w-full px-14 flex justify-between items-center">
            
            <div class="flex items-baseline gap-4">
                <a href="index.html" class="text-4xl font-bold tracking-tight text-stone-900">Jay Reario</a>
                <p class="text-xl text-stone-500 font-medium">Aspiring Agogo Dancer</p>
            </div>

            <nav class="hidden md:flex gap-8 text-lg font-medium text-stone-600">
                <a href="resume.html" class="hover:text-amber-600 transition-colors">Resume</a>
                <a href="projects.html" class="hover:text-amber-600 transition-colors">Projects</a>
                <a href="contact.html" class="hover:text-amber-600 transition-colors">Contact</a>
            </nav>

            <div class="md:hidden">
                <button id="mobile-menu-btn" class="text-stone-600 hover:text-stone-900 focus:outline-none">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>

        <nav id="mobile-menu" class="hidden md:hidden flex flex-col px-14 py-4 mt-6 space-y-4 bg-stone-600 rounded-lg mx-14">
            <a href="resume.html" class="block font-bold text-stone-50 hover:text-amber-600">Resume</a>
            <a href="projects.html" class="block font-bold text-stone-50 hover:text-amber-600">Projects</a>
            <a href="contact.html" class="block font-bold text-stone-50 hover:text-amber-600">Contact</a>
        </nav>
    
    </header>

    <main id="body" class="flex-grow max-w-5xl mx-auto w-full px-6 py-14 flex flex-col gap-6">
        
        <div class="flex justify-between items-end border-b border-stone-200 pb-4">
            <h2 class="text-5xl font-black text-stone-900 tracking-tighter">My Resume</h2>
            
            <a href="assets/resume.pdf" download class="bg-amber-600 text-stone-50 px-6 py-2 rounded-full font-bold shadow-md transition-all hover:bg-amber-700 hover:scale-105 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download PDF
            </a>
        </div>

        <div class="w-full bg-stone-200 p-2 rounded-xl shadow-inner border border-stone-300">
            <iframe 
                src="assets/resume.pdf" 
                class="w-full h-[75vh] min-h-[600px] rounded-lg border-none bg-white" 
                title="Jay Reario Resume PDF">
            </iframe>
        </div>

    </main>

    <hr class="border-stone-200 mx-14">

    <footer id="footer" class="bg-stone-50 py-12">
        <div class="w-full px-14 flex flex-col md:flex-row justify-between items-start gap-8">
        
            <div class="flex flex-col">
                <h4 class="text-stone-400 text-xs font-bold uppercase tracking-[0.2em]">Phone</h4>
                <p class="mt-1 font-semibold text-stone-800">xxx-xxx-xxxx</p>
            </div>

            <div class="flex flex-col">
                <h4 class="text-stone-400 text-xs font-bold uppercase tracking-[0.2em]">Email</h4>
                <p class="mt-1 font-semibold text-stone-800">jay@example.com</p>
            </div>

            <div class="flex flex-col">
                <h4 class="text-stone-400 text-xs font-bold uppercase tracking-[0.2em]">Location</h4>
                <p class="mt-1 font-semibold text-stone-800">Makati City, PH</p>
            </div>

            <div class="flex flex-col">
                <h4 class="text-stone-400 text-xs font-bold uppercase tracking-[0.2em]">Profile Views</h4>
                <p id="counter" class="mt-1 font-black text-amber-600">Loading...</p>
            </div>

        </div>

        <div class="w-full mt-4 pt-4 text-center">
            <p class="text-stone-500 text-sm">
                &copy; <span id="year"></span> Jay Reario. Built for the Cloud Resume Challenge.
            </p>
        </div>

    </footer>

</body>
</html>
